name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Four-part version of an existing release tag, for example 0.0.0.15"
        required: true
        type: string
      draft:
        description: "Create or update the release as a draft"
        required: true
        type: boolean
        default: true
      ppa_revision:
        description: "PPA upload revision; raise it to upload a version Launchpad already has again"
        required: false
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_CONFIGURATION: Release
  ETO_REPOSITORY: https://github.com/keysharp-org/Eto.git
  ETO_BRANCH: Keysharp
  # Each series gets its own source upload and rehearsal.
  PPA: descolada/keysharp
  PPA_SERIES: noble resolute

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      draft: ${{ steps.version.outputs.draft }}
      ppa_series: ${{ steps.version.outputs.ppa_series }}
      source_sha: ${{ steps.refs.outputs.source_sha }}
      eto_sha: ${{ steps.refs.outputs.eto_sha }}
      kpm_tag: ${{ steps.refs.outputs.kpm_tag }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DRAFT: ${{ inputs.draft }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
            tag="v$version"
            draft="${REQUESTED_DRAFT,,}"
          else
            tag="$TRIGGER_REF_NAME"
            version="${tag#v}"
            draft=true
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$tag" != "v$version" ]]; then
            echo "Release tag must contain a four-part numeric version, for example v0.0.0.15. Got '$tag'." >&2
            exit 1
          fi
          if [[ "$draft" != "true" && "$draft" != "false" ]]; then
            echo "Draft must be true or false. Got '$draft'." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "ppa_series=$(jq -cn --arg series "$PPA_SERIES" '$series | split(" ")')" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      # The tag fixes every input: flake.lock pins Eto and Keysharp.Payload.proj pins the KPM release.
      - name: Resolve pinned sources
        id: refs
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$source_sha" != "$tag_sha" ]]; then
            echo "Checked out $source_sha, but $RELEASE_TAG resolves to $tag_sha." >&2
            exit 1
          fi

          eto_sha=$(jq -r '.nodes.eto.locked.rev' flake.lock)
          kpm_tag=$(sed -n 's:.*<KpmVersion[^>]*>\(.*\)</KpmVersion>.*:\1:p' Keysharp.Install/payload/Keysharp.Payload.proj | head -n 1)
          if [[ ! "$eto_sha" =~ ^[0-9a-f]{40}$ || -z "$kpm_tag" ]]; then
            echo "flake.lock must pin Eto and Keysharp.Payload.proj must name a KPM release." >&2
            exit 1
          fi
          read -r eto_head _ < <(git ls-remote "$ETO_REPOSITORY" "refs/heads/$ETO_BRANCH")
          if [[ "$eto_head" != "$eto_sha" ]]; then
            echo "::warning::flake.lock pins Eto $eto_sha, but $ETO_BRANCH is at $eto_head. The release builds the pinned revision."
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "eto_sha=$eto_sha" >> "$GITHUB_OUTPUT"
          echo "kpm_tag=$kpm_tag" >> "$GITHUB_OUTPUT"
          echo "Release source $source_sha, Eto $eto_sha, KPM $kpm_tag."

  package:
    needs: prepare
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Exposed as env (not read straight from `secrets` in step `if:`) because the `secrets` context is not
    # available to `if:` expressions. Empty on forks / when the secret is unset, which keeps macOS builds
    # unsigned exactly as before instead of failing.
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            os: windows-latest
            rid: win-x64
          - name: Windows arm64
            platform: windows
            os: windows-11-arm
            rid: win-arm64
          - name: Linux x64
            platform: linux
            os: ubuntu-24.04
            rid: linux-x64
          - name: Linux arm64
            platform: linux
            os: ubuntu-24.04-arm
            rid: linux-arm64
          - name: macOS 15 arm64
            platform: macos
            os: macos-15
            rid: osx-arm64
            macos_version: '15'
            arch: arm64
          - name: macOS 15 Intel
            platform: macos
            os: macos-15-intel
            rid: osx-x64
            macos_version: '15'
            arch: x64

    steps:
      - name: Checkout keysharp
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.wixproj
            **/packages.lock.json

      - name: Cache Eto (non-Windows)
        if: ${{ matrix.platform != 'windows' }}
        id: eto-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.workspace }}/Eto
          key: eto-${{ matrix.os }}-${{ matrix.rid }}-${{ needs.prepare.outputs.eto_sha }}

      - name: Checkout Eto (non-Windows, cache miss)
        if: ${{ matrix.platform != 'windows' && steps.eto-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $etoDir = Join-Path $env:RUNNER_WORKSPACE "Eto"
          if (Test-Path $etoDir) {
            Remove-Item -LiteralPath $etoDir -Recurse -Force
          }
          git clone --branch "$env:ETO_BRANCH" --recurse-submodules $env:ETO_REPOSITORY $etoDir
          git -C $etoDir checkout "${{ needs.prepare.outputs.eto_sha }}"
          git -C $etoDir submodule update --init --recursive

      - name: Verify Eto checkout (non-Windows)
        if: ${{ matrix.platform != 'windows' }}
        shell: pwsh
        run: |
          $etoDir = Join-Path $env:RUNNER_WORKSPACE "Eto"
          $expected = "${{ needs.prepare.outputs.eto_sha }}"
          $current = git -C $etoDir rev-parse HEAD
          if ($current -ne $expected) {
            Write-Host "Cached Eto checkout was $current; updating to $expected."
            git -C $etoDir remote set-url origin $env:ETO_REPOSITORY
            git -C $etoDir fetch origin "$env:ETO_BRANCH"
            git -C $etoDir checkout --force $expected
          }
          if (-not (Test-Path "$etoDir/lib/monomac/src/MonoMac.csproj")) {
            Write-Host "MonoMac submodule missing, initializing..."
          } else {
            Write-Host "MonoMac submodule present."
          }
          git -C $etoDir submodule update --init --recursive

      - name: Verify macOS release runner
        if: ${{ matrix.platform == 'macos' }}
        shell: pwsh
        run: |
          $actualVersion = (& sw_vers -productVersion).Trim()
          $actualArch = (& uname -m).Trim()
          $expectedVersion = '${{ matrix.macos_version }}'
          $expectedArch = if ('${{ matrix.arch }}' -eq 'x64') { 'x86_64' } else { 'arm64' }

          if (-not $actualVersion.StartsWith("$expectedVersion.")) {
            throw "Expected macOS $expectedVersion.x, but runner reported $actualVersion."
          }
          if ($actualArch -ne $expectedArch) {
            throw "Expected architecture $expectedArch, but runner reported $actualArch."
          }

          Write-Host "Verified release host macOS $actualVersion on $actualArch for ${{ matrix.rid }}."

      # Windows packages are built on hardware matching the target, as every other platform here is.
      # Cross-publishing succeeds but degrades the result silently - Scripts\WindowSpy.cks cannot be
      # produced for an architecture the build machine cannot execute - so a mismatched runner has to fail
      # the release rather than ship a lesser package.
      - name: Verify Windows release runner
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $actualArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $expectedArch = if ('${{ matrix.rid }}' -eq 'win-arm64') { 'arm64' } else { 'x64' }

          if ($actualArch -ne $expectedArch) {
            throw "${{ matrix.rid }} must be built on a $expectedArch runner, but this one reports $actualArch. Cross-publishing would omit Scripts\WindowSpy.cks."
          }

          Write-Host "Verified release host $actualArch for ${{ matrix.rid }}."

      # dpkg-dev builds the .deb; libX11 is the one native library the published host loads while it
      # precompiles the bundled scripts.
      - name: Install Linux package dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          # Third-party repos on the runner image (Chrome, MS) periodically serve a stale
          # index and fail the whole update; nothing installed here comes from them.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev libx11-6

      # The installer is a WiX v5 SDK-style project whose toolset restores from NuGet, so the Windows
      # release needs nothing on the runner beyond the .NET SDK. 

      - name: Publish Windows package
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        env:
          KEYSHARP_VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          $assetRoot = Join-Path $PWD "dist/release-assets"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null

          ./Keysharp.Install/package-windows.ps1 `
            -Configuration $env:BUILD_CONFIGURATION `
            -RuntimeIdentifier $env:RID `
            -Version $env:KEYSHARP_VERSION

          $msi = Join-Path $PWD "dist/Keysharp-$env:RID.msi"
          if (-not (Test-Path $msi)) {
            throw "Expected MSI was not produced: $msi"
          }
          Copy-Item -LiteralPath $msi -Destination (Join-Path $assetRoot "keysharp-$env:KEYSHARP_VERSION-$env:RID.msi") -Force

          $zip = Join-Path $PWD "dist/Keysharp-$env:RID.zip"
          if (-not (Test-Path $zip)) {
            throw "Expected zip was not produced: $zip"
          }
          Copy-Item -LiteralPath $zip -Destination (Join-Path $assetRoot "keysharp-$env:KEYSHARP_VERSION-$env:RID.zip") -Force

      - name: Publish Linux package
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
          CONFIG: Release
        run: |
          bash Keysharp.Install/package-linux.sh
          mkdir -p dist/release-assets
          mv "dist/keysharp-${RID}.tar.gz" "dist/release-assets/keysharp-${VERSION}-${RID}.tar.gz"
          # The setup script resolves all three projects from their own releases, so it ships once,
          # from the x64 job, rather than per architecture.
          if [ "${RID}" = linux-x64 ]; then
            install -m 0755 Keysharp.Install/linux/keysharp-linux-setup.sh dist/release-assets/keysharp-linux-setup.sh
          fi
          # The .deb keeps Debian's name_version_arch convention, which is what dpkg, apt and a
          # package repository expect, and what the two component projects publish.
          for deb in dist/keysharp_${VERSION}_*.deb; do
            [ -e "$deb" ] || continue
            mv "$deb" dist/release-assets/
          done

      - name: Import macOS signing certificate
        if: ${{ matrix.platform == 'macos' && env.MACOS_CERT_P12_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/keysharp-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/keysharp-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"

          # Decode the base64-encoded .p12 secret back into a real file.
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Sign out of a throwaway keychain instead of the runner's login keychain, so the private key
          # never lands in shared state and the cleanup step can delete the whole keychain afterwards.
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"   # don't auto-lock mid-build
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Import the identity and pre-authorize codesign to use its private key without a GUI prompt.
          security import "$CERT_PATH" -P "$MACOS_CERT_P12_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null

          # Prepend our keychain to the search list (preserving the existing ones) so that
          # `codesign --sign Keysharp` and `security find-identity` inside package-macos.sh resolve it.
          EXISTING="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          rm -f "$CERT_PATH"

          # Hand the keychain path to the cleanup step so it always gets removed.
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Publish macOS package
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
          CONFIG: Release
          # Sign the .app bundles and .dmg with the stable self-signed identity when its cert secret is
          # present; otherwise stay empty so package-macos.sh produces an unsigned build as before.
          APP_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && 'Keysharp' || '' }}
        run: |
          chmod +x Keysharp.Install/package-macos.sh
          Keysharp.Install/package-macos.sh
          mkdir -p dist/release-assets
          mv "dist/Keysharp-${RID}.pkg" "dist/release-assets/keysharp-${VERSION}-${RID}.pkg"
          mv "dist/Keysharp-${RID}.dmg" "dist/release-assets/keysharp-${VERSION}-${RID}.dmg"

      - name: Remove macOS signing keychain
        if: ${{ always() && matrix.platform == 'macos' && env.SIGNING_KEYCHAIN != '' }}
        shell: bash
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.rid }}
          path: dist/release-assets/*
          if-no-files-found: error

  # See Keysharp.Install/ppa/README.md.
  ppa-source:
    needs: prepare
    name: Build PPA sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Checkout pinned Eto
        uses: actions/checkout@v7
        with:
          repository: keysharp-org/Eto
          ref: ${{ needs.prepare.outputs.eto_sha }}
          path: .ppa/Eto
          persist-credentials: false

      - name: Checkout pinned KPM
        uses: actions/checkout@v7
        with:
          repository: keysharp-org/KPM
          ref: refs/tags/${{ needs.prepare.outputs.kpm_tag }}
          path: .ppa/KPM
          fetch-depth: 0
          persist-credentials: false

      - name: Install Debian source tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper

      - name: Build source uploads
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ env.PPA_SERIES }}
          PPA_REVISION: ${{ inputs.ppa_revision || '1' }}
          RESTORE_IN: docker
          ETO_CHECKOUT: ${{ github.workspace }}/.ppa/Eto
          KPM_CHECKOUT: ${{ github.workspace }}/.ppa/KPM
          OUTPUT_DIR: ${{ github.workspace }}/dist/ppa
        run: bash Keysharp.Install/ppa/build-source.sh

      - name: Upload source uploads
        uses: actions/upload-artifact@v7
        with:
          name: ppa-source
          path: dist/ppa/*
          if-no-files-found: error

  # Launchpad accepts a version once, so every series and architecture is built here first.
  ppa-rehearse:
    needs:
      - prepare
      - ppa-source
    name: Rehearse PPA build (${{ matrix.series }} ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.prepare.outputs.ppa_series) }}
        arch: [amd64, arm64]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download source uploads
        uses: actions/download-artifact@v8
        with:
          name: ppa-source
          path: dist/ppa

      - name: Build as Launchpad would
        env:
          SERIES: ${{ matrix.series }}
        run: bash Keysharp.Install/ppa/rehearse.sh dist/ppa/keysharp_*~"$SERIES"*.dsc "$SERIES" dist/rehearsal

      - name: Upload rehearsal packages
        uses: actions/upload-artifact@v7
        with:
          name: ppa-rehearsal-${{ matrix.series }}-${{ matrix.arch }}
          path: dist/rehearsal/*.deb
          retention-days: 7

  publish-release:
    needs:
      - prepare
      - package
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # This job needs more access than the top-level read-only permission. id-token +
    # attestations are what actions/attest-build-provenance needs to mint an OIDC-signed provenance and
    # push it to the repo's attestation store.
    permissions:
      contents: write       # create/update the release and upload assets
      id-token: write       # OIDC token used to sign the provenance (Sigstore)
      attestations: write   # write the attestation to the repo's attestation store
      artifact-metadata: write # create the artifact record associated with actions/attest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Verify release tag did not move
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: dist/release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release-assets
          shopt -s nullglob
          # Bare filenames (not paths) so users can `sha256sum -c SHA256SUMS` from the download folder.
          # Both separators are matched because the .deb carries Debian's name_version_arch form;
          # SHA256SUMS itself starts with neither, so it excludes the file being written.
          files=(keysharp-* keysharp_*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found to checksum." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Mint SLSA build-provenance attestations binding each asset's digest to this workflow run, so users
      # can `gh attestation verify <file> --repo <owner>/<repo>`. SHA256SUMS is attested too, giving it
      # provenance as well. Bump the major if a newer one ships.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/release-assets/*'

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" == "true" ]]; then
              gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            else
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRAFT" == "true" ]]; then
                echo "Refusing to turn published release $TAG back into a mutable draft." >&2
                exit 1
              fi
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              gh release edit "$TAG" --draft="$DRAFT" --repo "$GITHUB_REPOSITORY"
            fi
          else
            args=(release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY")
            if [ "$DRAFT" = "true" ]; then
              args+=(--draft)
            fi
            gh "${args[@]}"
          fi

  # Not after publish-release, which refuses a rerun once the release is published.
  publish-ppa:
    needs:
      - prepare
      - ppa-rehearse
    if: ${{ needs.prepare.outputs.draft == 'false' }}
    name: Upload to Launchpad PPA
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download source uploads
        uses: actions/download-artifact@v8
        with:
          name: ppa-source
          path: dist/ppa

      - name: Install upload tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts dput

      - name: Sign and upload
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: bash Keysharp.Install/ppa/upload.sh "$PPA" dist/ppa/*_source.changes
