name: Curated Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Platform to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
          - macos
      configuration:
        description: "Build configuration"
        required: true
        type: choice
        default: Debug
        options:
          - Debug
          - Release

concurrency:
  group: curated-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Dispatch-only by choice: this is not a per-push gate. If a push/pull_request trigger is ever added, note
  # that `inputs` is empty on those events - both this and the target_platform switch below fall back to
  # nothing, so `dotnet test -c ""` fails immediately. Give each a default at that point (ci.yml shows the
  # `github.event_name == 'workflow_dispatch' && inputs.x || '<default>'` form).
  BUILD_CONFIGURATION: ${{ inputs.configuration }}
  # Category=RequiresHook is excluded: those tests need the keysharp-inputd global hook and, on a desktop with
  # the daemon, prompt for input-access permission. The curated set must run without any user interaction, so
  # hook-dependent tests do not belong in it. The full (interactive) test run does not apply this exclusion.
  # The clipboard entries are named individually on purpose: they are the ClipboardTests that touch no clipboard
  # (the CF_HTML codec, the uri-list parser, the OnChange hook's bookkeeping), so they are deterministic on a
  # headless runner. The rest of Category=Clipboard shares one process-wide resource with whatever else is running
  # and stays out of CI, like the pre-existing Env clipboard tests.
  CURATED_TEST_FILTER: (Category=Assign|Category=BuiltInVars|Category=Class|Category=Collections|Category=Curated|Category=Directives|Category=Flow|Category=Function|Category=Hotstring|Category=Math|Category=Misc|Category=Module|Category=Operator|Category=Parser|Category=String|Category=Types|Category=FileAndDir|Category=Network|FullyQualifiedName~ClipboardTests.CfHtml|FullyQualifiedName~ClipboardTests.UriListParsing|FullyQualifiedName~ClipboardTests.OnChangeHook) & Category!=RequiresHook
  ETO_REPOSITORY: https://github.com/keysharp-org/Eto.git
  ETO_BRANCH: Keysharp

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        shell: pwsh
        run: |
          switch ('${{ inputs.target_platform }}') {
            'windows' {
              $matrix = '{"include":[{"name":"Windows x64","os":"windows-latest","platform":"windows","rid":"win-x64"}]}'
            }
            'linux' {
              $matrix = '{"include":[{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","rid":"linux-x64"}]}'
            }
            'macos' {
              $matrix = '{"include":[{"name":"macOS 15 arm64","os":"macos-15","platform":"macos","rid":"osx-arm64","macos_version":"15","arch":"arm64"},{"name":"macOS 26 arm64","os":"macos-26","platform":"macos","rid":"osx-arm64","macos_version":"26","arch":"arm64"},{"name":"macOS 15 Intel","os":"macos-15-intel","platform":"macos","rid":"osx-x64","macos_version":"15","arch":"x64"},{"name":"macOS 26 Intel","os":"macos-26-intel","platform":"macos","rid":"osx-x64","macos_version":"26","arch":"x64"}]}'
            }
            default {
              $matrix = '{"include":[{"name":"Windows x64","os":"windows-latest","platform":"windows","rid":"win-x64"},{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","rid":"linux-x64"},{"name":"macOS 15 arm64","os":"macos-15","platform":"macos","rid":"osx-arm64","macos_version":"15","arch":"arm64"},{"name":"macOS 26 arm64","os":"macos-26","platform":"macos","rid":"osx-arm64","macos_version":"26","arch":"arm64"},{"name":"macOS 15 Intel","os":"macos-15-intel","platform":"macos","rid":"osx-x64","macos_version":"15","arch":"x64"},{"name":"macOS 26 Intel","os":"macos-26-intel","platform":"macos","rid":"osx-x64","macos_version":"26","arch":"x64"}]}'
            }
          }
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

  test:
    needs: prepare
    name: Curated Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout keysharp
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Resolve latest Eto ref (non-Windows)
        if: ${{ matrix.platform != 'windows' }}
        id: eto-ref
        shell: pwsh
        run: |
          $line = git ls-remote $env:ETO_REPOSITORY "refs/heads/$env:ETO_BRANCH"
          $sha = ($line -split "\s+")[0]
          if (-not $sha) {
            throw "Could not resolve $env:ETO_REPOSITORY branch $env:ETO_BRANCH."
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved Eto $env:ETO_BRANCH to $sha"

      - name: Cache Eto (non-Windows)
        if: ${{ matrix.platform != 'windows' }}
        id: eto-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.workspace }}/Eto
          key: eto-${{ matrix.os }}-${{ matrix.rid }}-${{ steps.eto-ref.outputs.sha }}

      - name: Checkout Eto (non-Windows, cache miss)
        if: ${{ matrix.platform != 'windows' && steps.eto-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $etoDir = Join-Path $env:RUNNER_WORKSPACE "Eto"
          if (Test-Path $etoDir) {
            Remove-Item -Path $etoDir -Recurse -Force
          }
          git clone --branch "$env:ETO_BRANCH" --recurse-submodules $env:ETO_REPOSITORY $etoDir
          git -C $etoDir checkout "${{ steps.eto-ref.outputs.sha }}"
          git -C $etoDir submodule update --init --recursive

      - name: Verify Eto checkout (non-Windows)
        if: ${{ matrix.platform != 'windows' }}
        shell: pwsh
        run: |
          $etoDir = Join-Path $env:RUNNER_WORKSPACE "Eto"
          $expected = "${{ steps.eto-ref.outputs.sha }}"
          $current = git -C $etoDir rev-parse HEAD
          if ($current -ne $expected) {
            Write-Host "Cached Eto checkout was $current; updating to $expected."
            git -C $etoDir remote set-url origin $env:ETO_REPOSITORY
            git -C $etoDir fetch origin "$env:ETO_BRANCH"
            git -C $etoDir checkout --force $expected
          }
          if (-not (Test-Path "$etoDir/lib/monomac/src/MonoMac.csproj")) {
            Write-Host "MonoMac submodule missing, initializing..."
          } else {
            Write-Host "MonoMac submodule present."
          }
          git -C $etoDir submodule update --init --recursive

      - name: Show run config
        shell: pwsh
        run: |
          Write-Host "Platform: ${{ matrix.platform }}"
          Write-Host "Runner: ${{ matrix.os }}"
          Write-Host "RID: ${{ matrix.rid }}"
          Write-Host "Configuration: $env:BUILD_CONFIGURATION"
          Write-Host "Filter: $env:CURATED_TEST_FILTER"

      - name: Verify macOS version and architecture
        if: ${{ matrix.platform == 'macos' }}
        shell: pwsh
        run: |
          $actualVersion = (& sw_vers -productVersion).Trim()
          $actualArch = (& uname -m).Trim()
          $expectedVersion = '${{ matrix.macos_version }}'
          $expectedArch = if ('${{ matrix.arch }}' -eq 'x64') { 'x86_64' } else { 'arm64' }

          if (-not $actualVersion.StartsWith("$expectedVersion.")) {
            throw "Expected macOS $expectedVersion.x, but runner reported $actualVersion."
          }
          if ($actualArch -ne $expectedArch) {
            throw "Expected architecture $expectedArch, but runner reported $actualArch."
          }

          Write-Host "Verified macOS $actualVersion on $actualArch."

      - name: Install Linux UI deps
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libgtk-3-0 libnotify4 at-spi2-core libappindicator3-1 || sudo apt-get install -y libayatana-appindicator3-1

      - name: Run curated Keysharp.Tests subset
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -eq 'linux') {
            $cfg = $env:BUILD_CONFIGURATION
            $filter = $env:CURATED_TEST_FILTER
            $cmd = "export GDK_BACKEND=x11; export NO_AT_BRIDGE=1; export GTK_A11Y=none; export GSETTINGS_BACKEND=memory; xvfb-run -a -s `"-screen 0 1920x1080x24 -ac +extension RANDR`" dotnet test Keysharp.Tests/Keysharp.Tests.csproj -c $cfg --nologo --logger `"console;verbosity=normal`" --filter `"$filter`" --blame-crash --blame-hang --blame-hang-timeout 5m -- NUnit.NumberOfTestWorkers=1"
            dbus-run-session -- bash -lc $cmd
          } else {
            $filter = $env:CURATED_TEST_FILTER
            if ('${{ matrix.platform }}' -eq 'macos') {
              # These tests exercise Quartz keyboard/mouse event construction without requiring interactive TCC grants.
              $filter = "($filter)|FullyQualifiedName~MacInputTests"
            }
            dotnet test Keysharp.Tests/Keysharp.Tests.csproj -c $env:BUILD_CONFIGURATION --nologo --logger "console;verbosity=normal" --filter "$filter" --blame-crash --blame-hang --blame-hang-timeout 5m -- NUnit.NumberOfTestWorkers=1
          }

      - name: Dump test output diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $out = Join-Path $PWD "bin/$env:BUILD_CONFIGURATION/net10.0"
          if (Test-Path $out) {
            Write-Host "Listing output folder: $out"
            Get-ChildItem -Path $out | Select-Object Name, Length
            $deps = Join-Path $out "Keysharp.Tests.deps.json"
            if (Test-Path $deps) {
              Write-Host "Keysharp.Core references from deps:"
              Select-String -Path $deps -Pattern "Keysharp.Core" -SimpleMatch
            }
          } else {
            Write-Host "Output folder missing: $out"
          }
