name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Platform to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
          - macos
          - nixos
      configuration:
        description: "Build configuration"
        required: true
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - both

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Release' }}
  ETO_REPOSITORY: https://github.com/keysharp-org/Eto.git
  ETO_BRANCH: Keysharp

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        shell: pwsh
        run: |
          # 'gate' is what push/pull_request runs: one leg per OS. The build is a compile check, and every
          # project is AnyCPU (see Directory.Build.props), so the macOS version/architecture fan-out below
          # would compile the same IL four times over. That fan-out stays available on workflow_dispatch.
          #
          # NixOS is deliberately absent from 'gate'. It is the only leg that packages rather than compiles,
          # and it costs minutes rather than the seconds the compile legs take, so it is opt-in: pick it
          # here on a manual run, or take it as part of 'all'.
          $target = '${{ github.event_name == 'workflow_dispatch' && inputs.target_platform || 'gate' }}'
          switch ($target) {
            'windows' {
              $matrix = '{"include":[{"name":"Windows x64","os":"windows-latest","platform":"windows","rid":"win-x64"}]}'
            }
            'linux' {
              $matrix = '{"include":[{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","rid":"linux-x64"}]}'
            }
            'macos' {
              $matrix = '{"include":[{"name":"macOS 15 arm64","os":"macos-15","platform":"macos","rid":"osx-arm64","macos_version":"15","arch":"arm64"},{"name":"macOS 26 arm64","os":"macos-26","platform":"macos","rid":"osx-arm64","macos_version":"26","arch":"arm64"},{"name":"macOS 15 Intel","os":"macos-15-intel","platform":"macos","rid":"osx-x64","macos_version":"15","arch":"x64"},{"name":"macOS 26 Intel","os":"macos-26-intel","platform":"macos","rid":"osx-x64","macos_version":"26","arch":"x64"}]}'
            }
            'gate' {
              $matrix = '{"include":[{"name":"Windows x64","os":"windows-latest","platform":"windows","rid":"win-x64"},{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","rid":"linux-x64"},{"name":"macOS 15 arm64","os":"macos-15","platform":"macos","rid":"osx-arm64","macos_version":"15","arch":"arm64"}]}'
            }
            'nixos' {
              $matrix = '{"include":[{"name":"NixOS","os":"ubuntu-latest","platform":"nixos"}]}'
            }
            default {
              $matrix = '{"include":[{"name":"Windows x64","os":"windows-latest","platform":"windows","rid":"win-x64"},{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","rid":"linux-x64"},{"name":"macOS 15 arm64","os":"macos-15","platform":"macos","rid":"osx-arm64","macos_version":"15","arch":"arm64"},{"name":"macOS 26 arm64","os":"macos-26","platform":"macos","rid":"osx-arm64","macos_version":"26","arch":"arm64"},{"name":"macOS 15 Intel","os":"macos-15-intel","platform":"macos","rid":"osx-x64","macos_version":"15","arch":"x64"},{"name":"macOS 26 Intel","os":"macos-26-intel","platform":"macos","rid":"osx-x64","macos_version":"26","arch":"x64"},{"name":"NixOS","os":"ubuntu-latest","platform":"nixos"}]}'
            }
          }
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout keysharp
        uses: actions/checkout@v7

      # The NixOS leg takes no part in the .NET setup below: the flake selects its own SDK and resolves
      # Eto separately, then builds through nix rather than the solution. Its steps are at the end.
      - name: Setup .NET SDK
        if: ${{ matrix.platform != 'nixos' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Resolve latest Eto ref (non-Windows)
        if: ${{ matrix.platform != 'windows' && matrix.platform != 'nixos' }}
        id: eto-ref
        shell: pwsh
        run: |
          $line = git ls-remote $env:ETO_REPOSITORY "refs/heads/$env:ETO_BRANCH"
          $sha = ($line -split "\s+")[0]
          if (-not $sha) {
            throw "Could not resolve $env:ETO_REPOSITORY branch $env:ETO_BRANCH."
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved Eto $env:ETO_BRANCH to $sha"

      - name: Cache Eto (non-Windows)
        if: ${{ matrix.platform != 'windows' && matrix.platform != 'nixos' }}
        id: eto-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.workspace }}/Eto
          key: eto-${{ matrix.os }}-${{ matrix.rid }}-${{ steps.eto-ref.outputs.sha }}

      - name: Checkout Eto (non-Windows, cache miss)
        if: ${{ matrix.platform != 'windows' && matrix.platform != 'nixos' && steps.eto-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $etoDir = Join-Path $env:RUNNER_WORKSPACE "Eto"
          if (Test-Path $etoDir) {
            Remove-Item -Path $etoDir -Recurse -Force
          }
          git clone --branch "$env:ETO_BRANCH" --recurse-submodules $env:ETO_REPOSITORY $etoDir
          git -C $etoDir checkout "${{ steps.eto-ref.outputs.sha }}"
          git -C $etoDir submodule update --init --recursive

      - name: Verify Eto checkout (non-Windows)
        if: ${{ matrix.platform != 'windows' && matrix.platform != 'nixos' }}
        shell: pwsh
        run: |
          $etoDir = Join-Path $env:RUNNER_WORKSPACE "Eto"
          $expected = "${{ steps.eto-ref.outputs.sha }}"
          $current = git -C $etoDir rev-parse HEAD
          if ($current -ne $expected) {
            Write-Host "Cached Eto checkout was $current; updating to $expected."
            git -C $etoDir remote set-url origin $env:ETO_REPOSITORY
            git -C $etoDir fetch origin "$env:ETO_BRANCH"
            git -C $etoDir checkout --force $expected
          }
          if (-not (Test-Path "$etoDir/lib/monomac/src/MonoMac.csproj")) {
            Write-Host "MonoMac submodule missing, initializing..."
          } else {
            Write-Host "MonoMac submodule present."
          }
          git -C $etoDir submodule update --init --recursive

      - name: Show run config
        shell: pwsh
        run: |
          Write-Host "Platform: ${{ matrix.platform }}"
          Write-Host "Runner: ${{ matrix.os }}"
          if ('${{ matrix.platform }}' -eq 'nixos') {
            Write-Host "Scope: the flake (packaging); the configuration input does not apply"
          } else {
            Write-Host "Configuration: $env:BUILD_CONFIGURATION"
            Write-Host "Scope: Keysharp.sln (every project)"
          }

      - name: Verify macOS version and architecture
        if: ${{ matrix.platform == 'macos' }}
        shell: pwsh
        run: |
          $actualVersion = (& sw_vers -productVersion).Trim()
          $actualArch = (& uname -m).Trim()
          $expectedVersion = '${{ matrix.macos_version }}'
          $expectedArch = if ('${{ matrix.arch }}' -eq 'x64') { 'x86_64' } else { 'arm64' }

          if (-not $actualVersion.StartsWith("$expectedVersion.")) {
            throw "Expected macOS $expectedVersion.x, but runner reported $actualVersion."
          }
          if ($actualArch -ne $expectedArch) {
            throw "Expected architecture $expectedArch, but runner reported $actualArch."
          }

          Write-Host "Verified macOS $actualVersion on $actualArch."

      - name: Check macOS installer scripts
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          for script in Keysharp.Install/package-macos.sh Keysharp.Install/macos/*.sh; do
            bash -n "$script"
          done

      - name: Check Linux package lifecycle scripts
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          # -n checks only the first file it is given, so each script gets its own run.
          for script in Keysharp.Install/package-linux.sh Keysharp.Install/linux/install.sh \
            Keysharp.Install/linux/uninstall.sh Keysharp.Install/linux/tests/*.sh Keysharp.Install/ppa/*.sh; do
            bash -n "$script"
          done
          for script in Keysharp.Install/linux/debian/preinst Keysharp.Install/linux/debian/postinst \
            Keysharp.Install/linux/debian/prerm Keysharp.Install/linux/debian/postrm \
            Keysharp.Install/linux/component-notice.sh Keysharp.Install/linux/keysharp-linux-setup.sh; do
            sh -n "$script"
          done
          python3 -m py_compile Keysharp.Install/ppa/launchpad.py
          python3 scripts/check-workflow-shell.py .github/workflows/release.yml .github/workflows/ci.yml
          bash Keysharp.Install/package-linux.sh --help >/dev/null
          bash Keysharp.Install/linux/uninstall.sh --help >/dev/null
          sh Keysharp.Install/linux/keysharp-linux-setup.sh --help >/dev/null
          bash Keysharp.Install/linux/tests/application-channel-policy.sh
          bash Keysharp.Install/linux/tests/setup-resolution-policy.sh

      # The whole solution, never a list of projects. Naming projects individually is what let
      # Keysharp.Components, Keysharp.Tests, Keyview and the rest go uncompiled here: a hand-maintained list
      # silently stops covering whatever is added next. Keysharp.Components.Scripting.Parser/.Compiler are
      # the ones this matters most for - nothing references them at compile time (they are loaded as
      # components at runtime), so no dependency walk from an apphost reaches them either.
      #
      # No -r: every project is AnyCPU and the RID only picks an apphost and resolves native assets, neither
      # of which a compile check looks at (again see Directory.Build.props). RID-specific restore is still
      # exercised, because the shipping projects declare RuntimeIdentifiers and restore honors that list.
      # `dotnet publish -r <rid>` in release.yml remains the place where RID-specific output is validated.
      # Release, not Debug, is the default: it is what release.yml ships, and it is the stricter of the two
      # (it drops DEBUG from DefineConstants in every project and flips DebugType to none for the packaged
      # ones, so a `#if DEBUG` divergence breaks here and not in a Debug build). Debug and both remain
      # selectable on workflow_dispatch.
      - name: Build solution (Release)
        if: ${{ matrix.platform != 'nixos' && (env.BUILD_CONFIGURATION == 'both' || env.BUILD_CONFIGURATION == 'Release') }}
        shell: pwsh
        run: |
          dotnet build Keysharp.sln -c Release --nologo

      - name: Build solution (Debug)
        if: ${{ matrix.platform != 'nixos' && (env.BUILD_CONFIGURATION == 'both' || env.BUILD_CONFIGURATION == 'Debug') }}
        shell: pwsh
        run: |
          dotnet build Keysharp.sln -c Debug --nologo

      # The NixOS leg. It shares only the checkout above: the flake selects its own SDK and resolves the
      # latest Eto Keysharp revision once for this job. This checks that Keysharp still packages, which the
      # compile legs cannot see. Not on the gate - it runs when someone asks for it.
      - name: Install Nix
        if: ${{ matrix.platform == 'nixos' }}
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve latest Eto for Nix
        id: nix-inputs
        if: ${{ matrix.platform == 'nixos' }}
        shell: bash
        run: nix flake update --refresh eto

      # Evaluates every output for both supported architectures and builds checks.nixos-module, which
      # composes nixosModules.default into a real NixOS system. Only this runner's architecture is built;
      # the aarch64 outputs are evaluated, which is what catches a broken option or udev rule.
      - name: Check flake
        if: ${{ matrix.platform == 'nixos' }}
        shell: bash
        run: nix flake check -L --all-systems

      - name: Build keysharp
        if: ${{ matrix.platform == 'nixos' }}
        shell: bash
        run: nix build .#keysharp -L

      # What the packaging steps are actually for, checked on the built store path rather than inferred
      # from the log. The scripting components are the fragile one: nothing references them at compile
      # time, so they are only present if the payload staging really ran.
      - name: Verify package contents
        if: ${{ matrix.platform == 'nixos' }}
        shell: bash
        run: |
          set -euo pipefail
          app=result/lib/keysharp

          for path in \
            result/bin/keysharp \
            result/bin/keyview \
            "$app/Keysharp" \
            "$app/Keyview" \
            "$app/components/scripting/compiler/Keysharp.Components.Scripting.Compiler.dll" \
            "$app/components/scripting/parser/Keysharp.Components.Scripting.Parser.dll" \
            "$app/components/packages/nuget/Keysharp.Components.Packages.NuGet.dll" \
            "$app/Lib/AtSpi.ks" \
            result/share/applications/keysharp.desktop \
            result/share/applications/keyview.desktop \
            result/share/mime/packages/keysharp.xml \
            result/share/icons/hicolor/256x256/apps/keysharp.png
          do
            if [ ! -e "$path" ]; then
              echo "Missing from the built package: $path" >&2
              exit 1
            fi
          done

          if [ ! -e "$app/Keysharp.cks" ] && [ ! -e "$app/Keysharp.ks" ]; then
            echo "The package ships no Dash (neither Keysharp.cks nor Keysharp.ks)." >&2
            exit 1
          fi
          if [ ! -e "$app/Keysharp.cks" ]; then
            echo "::warning::The Dash shipped as source; it will be compiled on every start."
          fi

          grep -q "^Exec=keysharp " result/share/applications/keysharp.desktop

      # Runs the wrapper the way a user would, with no display available.
      - name: Smoke test
        if: ${{ matrix.platform == 'nixos' }}
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/.*<KeysharpVersion[^>]*>\([0-9.]*\)<\/KeysharpVersion>.*/\1/p' Directory.Build.props)
          reported=$(result/bin/keysharp --version)
          echo "Directory.Build.props: $expected, keysharp --version: $reported"
          test "$expected" = "$reported"

      # Only when something above broke. A stale nix/deps.json is the likeliest cause, and the build
      # already fails on a missing or wrong-hashed entry - what it cannot do is say which one or hand back
      # a corrected file. On a green run this would be a minute of restore that proves nothing.
      - name: Regenerate the offline NuGet set
        id: regen
        if: ${{ matrix.platform == 'nixos' && failure() && steps.nix-inputs.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          nix build .#keysharp.fetch-deps -L
          ./result "$PWD/regenerated-deps.json"

      - name: Upload regenerated set
        if: ${{ matrix.platform == 'nixos' && steps.regen.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-deps
          path: regenerated-deps.json

      # fetch-deps takes its runtime IDs from meta.platforms, so the regenerated set already covers both
      # architectures and should match. An extra entry is not free either: one that duplicates a package
      # the SDK supplies makes configureNuget fail with "ln: File exists".
      - name: Compare against nix/deps.json
        if: ${{ matrix.platform == 'nixos' && steps.regen.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys


          # NuGet ids are case-insensitive, and the two files do not have to agree on casing: fetch-deps
          # writes the id as the package declares it, a set read back from a packages folder is lowercase.
          def load(path):
              return {
                  (e["pname"].lower(), e["version"]): (e["pname"], e["hash"])
                  for e in json.load(open(path))
              }


          def name(mapping, key):
              return mapping[key][0]


          committed = load("nix/deps.json")
          regenerated = load("regenerated-deps.json")

          missing = sorted(set(regenerated) - set(committed))
          extra = sorted(set(committed) - set(regenerated))
          changed = sorted(
              key for key in set(committed) & set(regenerated)
              if committed[key][1] != regenerated[key][1]
          )

          for key in extra:
              print(f"::warning::nix/deps.json carries an entry the restore did not ask for, which collides with the SDK's own copy if it supplies one: {name(committed, key)} {key[1]}")
          for key in missing:
              print(f"::error::nix/deps.json is missing {name(regenerated, key)} {key[1]}")
          for key in changed:
              print(f"::error::nix/deps.json has the wrong hash for {name(regenerated, key)} {key[1]}")

          if missing or changed:
              print(
                  "\nDownload the regenerated-deps artifact and merge it into nix/deps.json.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"nix/deps.json covers all {len(regenerated)} restored packages.")
          PY
